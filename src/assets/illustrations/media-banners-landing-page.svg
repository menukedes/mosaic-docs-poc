<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" font-family="Inter, Segoe UI, Arial, sans-serif">
  <rect width="820" height="560" fill="#ffffff"/>
  <!-- browser frame -->
  <rect x="30" y="20" width="480" height="520" rx="12" fill="#ffffff" stroke="#9CA3AF" stroke-width="2"/>
  <rect x="30" y="20" width="480" height="34" rx="12" fill="#F3F4F6"/>
  <rect x="30" y="42" width="480" height="12" fill="#F3F4F6"/>
  <circle cx="52" cy="37" r="5" fill="#9CA3AF"/><circle cx="68" cy="37" r="5" fill="#9CA3AF"/><circle cx="84" cy="37" r="5" fill="#9CA3AF"/>
  <rect x="110" y="29" width="300" height="16" rx="8" fill="#ffffff" stroke="#E5E7EB"/>
  <!-- store header -->
  <rect x="46" y="66" width="448" height="40" rx="6" fill="#025E43"/>
  <rect x="60" y="78" width="90" height="16" rx="4" fill="#3FAE84"/>
  <rect x="330" y="80" width="40" height="12" rx="3" fill="#D9EFE6"/><rect x="380" y="80" width="40" height="12" rx="3" fill="#D9EFE6"/><rect x="430" y="80" width="50" height="12" rx="3" fill="#D9EFE6"/>
  <!-- section 1: category row -->
  <rect x="46" y="118" width="448" height="76" rx="6" fill="#F3F4F6"/>
  <rect x="58" y="128" width="96" height="10" rx="3" fill="#9CA3AF"/>
  <g fill="#ffffff" stroke="#E5E7EB"><rect x="58" y="146" width="96" height="38" rx="4"/><rect x="164" y="146" width="96" height="38" rx="4"/><rect x="270" y="146" width="96" height="38" rx="4"/><rect x="376" y="146" width="106" height="38" rx="4"/></g>
  <!-- section 2: image banner -->
  <rect x="46" y="206" width="448" height="96" rx="6" fill="#D9EFE6" stroke="#025E43" stroke-width="2"/>
  <path d="M120 286 L170 236 L205 266 L235 246 L290 286 Z" fill="#3FAE84"/>
  <circle cx="320" cy="238" r="12" fill="#3FAE84"/>
  <rect x="340" y="246" width="130" height="14" rx="4" fill="#025E43"/>
  <rect x="340" y="266" width="90" height="10" rx="3" fill="#3FAE84"/>
  <!-- section 3: category row -->
  <rect x="46" y="314" width="448" height="76" rx="6" fill="#F3F4F6"/>
  <rect x="58" y="324" width="96" height="10" rx="3" fill="#9CA3AF"/>
  <g fill="#ffffff" stroke="#E5E7EB"><rect x="58" y="342" width="96" height="38" rx="4"/><rect x="164" y="342" width="96" height="38" rx="4"/><rect x="270" y="342" width="96" height="38" rx="4"/><rect x="376" y="342" width="106" height="38" rx="4"/></g>
  <!-- section 4: video banner -->
  <rect x="46" y="402" width="448" height="96" rx="6" fill="#D9EFE6" stroke="#025E43" stroke-width="2"/>
  <circle cx="270" cy="450" r="26" fill="#025E43"/>
  <path d="M262 436 L262 464 L286 450 Z" fill="#ffffff"/>
  <rect x="46" y="486" width="448" height="6" fill="#3FAE84" opacity="0.5"/>
  <rect x="46" y="486" width="160" height="6" fill="#025E43"/>
  <rect x="46" y="510" width="448" height="20" rx="6" fill="#F3F4F6"/>
  <!-- labels -->
  <g font-size="15" fill="#111827">
    <line x1="500" y1="86" x2="560" y2="86" stroke="#9CA3AF" stroke-width="1.5"/>
    <text x="568" y="91">Your storefront header</text>
    <line x1="500" y1="156" x2="560" y2="156" stroke="#9CA3AF" stroke-width="1.5"/>
    <text x="568" y="152">Product category row</text>
    <line x1="500" y1="254" x2="560" y2="254" stroke="#025E43" stroke-width="2"/>
    <text x="568" y="250" font-weight="700" fill="#025E43">Media banner</text>
    <text x="568" y="270" font-size="13" fill="#374151">image or image carousel</text>
    <line x1="500" y1="352" x2="560" y2="352" stroke="#9CA3AF" stroke-width="1.5"/>
    <text x="568" y="348">Product category row</text>
    <line x1="500" y1="450" x2="560" y2="450" stroke="#025E43" stroke-width="2"/>
    <text x="568" y="446" font-weight="700" fill="#025E43">Media banner</text>
    <text x="568" y="466" font-size="13" fill="#374151">video</text>
  </g>
  <text x="568" y="512" font-size="13" fill="#374151">You choose the order of rows</text>
  <text x="568" y="530" font-size="13" fill="#374151">and banners on the landing page.</text>
</svg>
