<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 260" font-family="Inter, Segoe UI, Arial, sans-serif">
  <rect width="820" height="260" fill="#ffffff"/>
  <!-- image -->
  <rect x="20" y="20" width="240" height="140" rx="8" fill="#D9EFE6" stroke="#025E43" stroke-width="2"/>
  <path d="M50 140 L100 80 L140 115 L170 95 L230 140 Z" fill="#3FAE84"/>
  <circle cx="200" cy="60" r="14" fill="#3FAE84"/>
  <text x="140" y="192" text-anchor="middle" font-size="17" font-weight="700" fill="#025E43">Image</text>
  <text x="140" y="214" text-anchor="middle" font-size="13" fill="#374151">One still image.</text>
  <text x="140" y="232" text-anchor="middle" font-size="13" fill="#374151">Can link to a page.</text>
  <!-- carousel -->
  <rect x="290" y="20" width="240" height="140" rx="8" fill="#D9EFE6" stroke="#025E43" stroke-width="2"/>
  <rect x="318" y="38" width="184" height="96" rx="6" fill="#3FAE84" opacity="0.55"/>
  <path d="M304 90 L296 82 M304 74 L296 82" stroke="#025E43" stroke-width="3" stroke-linecap="round"/>
  <path d="M516 74 L524 82 M516 90 L524 82" stroke="#025E43" stroke-width="3" stroke-linecap="round"/>
  <circle cx="394" cy="147" r="4" fill="#025E43"/><circle cx="410" cy="147" r="4" fill="#9CA3AF"/><circle cx="426" cy="147" r="4" fill="#9CA3AF"/>
  <text x="410" y="192" text-anchor="middle" font-size="17" font-weight="700" fill="#025E43">Image carousel</text>
  <text x="410" y="214" text-anchor="middle" font-size="13" fill="#374151">Several images that rotate.</text>
  <text x="410" y="232" text-anchor="middle" font-size="13" fill="#374151">Each image can have its own link.</text>
  <!-- video -->
  <rect x="560" y="20" width="240" height="140" rx="8" fill="#D9EFE6" stroke="#025E43" stroke-width="2"/>
  <circle cx="680" cy="86" r="28" fill="#025E43"/>
  <path d="M671 71 L671 101 L697 86 Z" fill="#ffffff"/>
  <rect x="560" y="146" width="240" height="6" fill="#3FAE84" opacity="0.5"/>
  <rect x="560" y="146" width="90" height="6" fill="#025E43"/>
  <text x="680" y="192" text-anchor="middle" font-size="17" font-weight="700" fill="#025E43">Video</text>
  <text x="680" y="214" text-anchor="middle" font-size="13" fill="#374151">A short video clip.</text>
  <text x="680" y="232" text-anchor="middle" font-size="13" fill="#374151">Can link to a page.</text>
</svg>
